name: Politician Stock Tracker

on:
  schedule:
    # Esegue lo script ogni 6 ore (alle 00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Permette di avviare il bot manualmente con un click da GitHub

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il codice dal repository
        uses: actions/checkout@v4

      - name: Configura l'ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa le librerie necessarie
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Esegui lo script Python
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
